# Configuración para usar Alembic desde la línea de comandos (desarrollo).
# El servidor aplica las migraciones solo al arrancar (app/migrate.py).
# Uso: cd backend && DATABASE_URL=... SESSION_SECRET=... DATA_KEY=... alembic revision --autogenerate -m "descripción"
[alembic]
script_location = app/migrations
prepend_sys_path = .

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s [%(name)s] %(message)s
