<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Firmar consentimiento</title>
<meta name="description" content="Abra el enlace para revisar y firmar su consentimiento.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Alter-Karute">
<meta property="og:locale" content="es_CO">
<meta property="og:title" content="Firmar consentimiento · Alter-Karute">
<meta property="og:description" content="Abra el enlace para revisar y firmar su consentimiento.">
<meta property="og:image" content="__ORIGIN__/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="css/fonts.css">
<meta name="robots" content="noindex">
<style>
/* Página pública: el consultante lee y firma a distancia el consentimiento que le envió su terapeuta. */
:root{--bg:#F6F1E7;--surface:#FBF8F2;--surface2:#F1ECDF;--ink:#2B2A25;--muted:#6A675C;--line:#E3DBCB;--accent:#4E6B58;--accent-ink:#FFFFFF;--accent-soft:#E4EBE2;
  --ok:#2B7A4B;--ok-soft:#DDF0E4;--danger:#B3261E;--danger-soft:#F8DEDC;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1A211C;--surface:#222B25;--surface2:#2B362E;--ink:#ECE8DC;--muted:#A9B2A8;--line:#36423A;
  --accent:#8FB09A;--accent-ink:#1A211C;--accent-soft:#2C3A31;--ok:#6CCB92;--ok-soft:#183324;--danger:#F08A82;--danger-soft:#3B1E1C;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1A211C;--surface:#222B25;--surface2:#2B362E;--ink:#ECE8DC;--muted:#A9B2A8;--line:#36423A;
  --accent:#8FB09A;--accent-ink:#1A211C;--accent-soft:#2C3A31;--ok:#6CCB92;--ok-soft:#183324;--danger:#F08A82;--danger-soft:#3B1E1C;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px 16px}
main{max-width:720px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:21px;display:flex;gap:10px;align-items:center;line-height:1.25}
p{margin:0}.muted{color:var(--muted);font-size:14px}
.when{font-size:19px;font-weight:600}
.btns{display:flex;flex-direction:column;gap:10px}
button{font:inherit;font-weight:500;padding:12px 18px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
button.sec{background:none;color:var(--danger);border-color:var(--danger)}
button:disabled{opacity:.6;cursor:wait}
.res{padding:12px 14px;border-radius:8px}.res.ok{background:var(--ok-soft);color:var(--ok)}.res.bad{background:var(--danger-soft);color:var(--danger)}
label{font-size:14px;font-weight:600;color:var(--muted)}
input[type=text]{font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--ink);width:100%}
input[type=text]:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.doc{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:16px;white-space:pre-wrap;font-family:Georgia,"Times New Roman",serif;font-size:16px;line-height:1.6;max-height:60vh;overflow:auto}
.pad{border:1px dashed var(--accent);border-radius:8px;background:#fff;position:relative;touch-action:none}
.pad canvas{display:block;width:100%;height:170px;cursor:crosshair}
.pad .hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8a8799;pointer-events:none;font-size:14px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px}.check input{width:22px;height:22px;margin-top:2px;flex:none;accent-color:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button.ghost{background:none;color:var(--accent)}
.sigs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.sg{display:flex;flex-direction:column;gap:4px}.sg img{max-height:90px;max-width:100%;object-fit:contain;align-self:flex-start;background:#fff;border-radius:6px;padding:4px}.sg .ln{border-top:1px solid var(--line);padding-top:6px;font-size:14px}.sg .ph{height:90px;border:1px dashed var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px}
@media print{body{background:#fff;padding:0}.card{border:0;padding:0}.noprint{display:none!important}.doc{max-height:none;overflow:visible;border:0;background:none;padding:0}}
</style>
</head>
<body>
<main id="m"><div class="card"><p class="muted">Cargando…</p></div></main>
<script>
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const H = { 'Content-Type': 'application/json', 'X-Requested-With': 'archivo-clinico' };
const token = new URLSearchParams(location.search).get('t') || '';
const logo = '<svg width="28" height="28" viewBox="0 0 120 120" aria-hidden="true"><rect x="6" y="6" width="108" height="108" rx="16" fill="#4E6B58"/><rect x="34" y="22" width="52" height="64" rx="6" fill="#FFFFFF"/><rect x="46" y="14" width="28" height="16" rx="4" fill="#FFFFFF" stroke="#4E6B58" stroke-width="4"/><rect x="42" y="46" width="36" height="6" rx="3" fill="#4E6B58"/><rect x="42" y="58" width="36" height="6" rx="3" fill="#4E6B58"/><rect x="42" y="70" width="22" height="6" rx="3" fill="#4E6B58"/></svg>';
const card = h => { $('#m').innerHTML = `<div class="card">${h}</div>`; };
const fmt = iso => iso ? new Date(iso).toLocaleString('es-CO', { day: 'numeric', month: 'long', year: 'numeric', hour: 'numeric', minute: '2-digit' }) : '';
function rich(t) {
  return esc(t).split('\n').map(l => {
    const h = /^#\s+/.test(l) ? 'h' : /^[-•]\s+/.test(l) ? 'li' : '';
    l = l.replace(/^#\s+/, '').replace(/^[-•]\s+/, '').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/(^|[^*])\*(?!\s)(.+?)\*(?!\*)/g, '$1<i>$2</i>');
    return h === 'h' ? `<b style="font-size:1.12em">${l}</b>` : h === 'li' ? `<span style="display:inline-block;padding-left:1.3em;text-indent:-1em">•&nbsp; ${l}</span>` : l;
  }).join('\n');
}
let d, doc = '', pad;
function therBlock() {
  const t = d.terapeuta || {};
  return `<div class="sg">${t.firma ? `<img src="${t.firma}" alt="Firma de ${esc(t.nombre)}">` : '<div class="ph">Sin firma</div>'}<div class="ln"><b>${esc(t.nombre)}</b><br>Terapeuta tratante${t.cedula || t.registro ? '<br>' + [t.cedula ? 'C.C. ' + esc(t.cedula) : '', t.registro ? 'T.P. ' + esc(t.registro) : ''].filter(Boolean).join(' · ') : ''}${t.enviado ? '<br><span class="muted">Firmado: ' + esc(fmt(t.enviado)) + '</span>' : ''}</div></div>`;
}
const head = () => `<h1>${logo}${esc(d.tipo || 'Consentimiento informado')}</h1><p>Enviado por <b>${esc(d.profesional || 'su terapeuta')}</b>${d.consultorio ? ' · ' + esc(d.consultorio) : ''}</p>`;
const STATES = { firmado: ['ok', 'Este documento ya fue firmado. Gracias.'], vencido: ['bad', 'El enlace venció. Pida uno nuevo al consultorio.'], anulado: ['bad', 'Este enlace fue anulado por el consultorio.'], bloqueado: ['bad', 'Se superó el número de intentos. Pida un enlace nuevo al consultorio.'] };
function ask(msg) {
  if (d.estado !== 'pendiente') { const [k, t] = STATES[d.estado] || ['bad', 'Este enlace ya no está disponible.']; return card(head() + `<div class="res ${k}">${t}</div>`); }
  card(head() + (msg || '') + `<p>Para ver el documento, escriba el número de documento de identidad de ${d.quien === 'Acudiente' ? 'la persona que firma como acudiente o representante' : 'usted (consultante)'}.</p>
    <form id="f" class="btns" autocomplete="off"><label for="doc">Número de documento</label><input type="text" id="doc" inputmode="text" autocomplete="off" required><button type="submit">Ver el documento</button></form>
    <p class="muted">El enlace vence el ${esc(fmt(d.vence))}. Es personal: no lo reenvíe.</p>`);
  $('#doc').focus();
  $('#f').onsubmit = async e => {
    e.preventDefault(); doc = $('#doc').value.trim(); if (!doc) return;
    $('#f button').disabled = true;
    try {
      const r = await fetch('/api/firma/' + encodeURIComponent(token) + '/abrir', { method: 'POST', headers: H, body: JSON.stringify({ documento: doc }) });
      const j = await r.json().catch(() => ({}));
      if (r.status === 409) { await load(); return; }
      if (!r.ok) return ask(`<div class="res bad">${esc(j.detail || 'No se pudo abrir. Intente de nuevo.')}</div>`);
      Object.assign(d, j); read();
    } catch (err) { ask('<div class="res bad">No hay conexión. Intente de nuevo.</div>'); }
  };
}
function makePad(host) {
  host.innerHTML = '<canvas></canvas><div class="hint">Firme aquí con el dedo</div>';
  const c = host.firstElementChild, hint = host.lastElementChild, dpr = Math.max(1, devicePixelRatio || 1), w = host.clientWidth, h = 170;
  c.width = w * dpr; c.height = h * dpr; const x = c.getContext('2d'); x.scale(dpr, dpr); x.lineWidth = 2.4; x.lineCap = x.lineJoin = 'round'; x.strokeStyle = '#10222a';
  let on = false, empty = true, last;
  const pos = e => { const r = c.getBoundingClientRect(); return { x: (e.clientX - r.left) * (w / r.width), y: (e.clientY - r.top) * (h / r.height) }; };
  c.addEventListener('pointerdown', e => { on = true; last = pos(e); c.setPointerCapture(e.pointerId); x.beginPath(); x.moveTo(last.x, last.y); x.lineTo(last.x + .1, last.y + .1); x.stroke(); empty = false; hint.style.display = 'none'; e.preventDefault(); });
  c.addEventListener('pointermove', e => { if (!on) return; const p = pos(e); x.beginPath(); x.moveTo(last.x, last.y); x.lineTo(p.x, p.y); x.stroke(); last = p; e.preventDefault(); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => c.addEventListener(t, () => { on = false; }));
  return { isEmpty: () => empty, clear() { x.clearRect(0, 0, w, h); empty = true; hint.style.display = ''; },
    data() { const t = document.createElement('canvas'), tw = 360, th = Math.round(h * tw / w); t.width = tw; t.height = th; t.getContext('2d').drawImage(c, 0, 0, tw, th); return t.toDataURL('image/png'); } };
}
function read(msg) {
  card(head() + `<p>Firma: <b>${esc(d.firmante)}</b> · documento ${esc(d.documento)}</p><p class="muted noprint">Lea el documento completo. Si tiene preguntas, escríbale a su terapeuta antes de firmar.</p>
    <div class="doc" id="txt" tabindex="0">${rich(d.texto)}</div>
    <div class="sigs">${therBlock()}<div class="sg"><div class="ph">Aquí irá su firma</div><div class="ln"><b>${esc(d.firmante)}</b><br>${d.quien === 'Acudiente' ? 'Acudiente / representante legal' : 'Consultante'} · Doc. ${esc(d.documento)}</div></div></div>
    <div class="noprint btns">${msg || ''}
      <label class="check"><input type="checkbox" id="ok"> <span>Leí el documento, pude hacer preguntas y acepto de forma libre y voluntaria.</span></label>
      <div><label>Su firma</label><div class="pad" id="pad"></div><div class="row" style="margin-top:6px"><button type="button" class="ghost" id="clr">Borrar firma</button></div></div>
      <button id="sign">Firmar el documento</button>
      <p class="muted">Al firmar se guardan la fecha y la hora, la dirección IP y el tipo de dispositivo como constancia. Puede revocar este consentimiento cuando quiera.</p></div>`);
  pad = makePad($('#pad')); $('#clr').onclick = () => pad.clear();
  $('#sign').onclick = sign;
}
async function sign() {
  if (!$('#ok').checked) { $('#ok').focus(); return showErr('Marque la casilla de aceptación.'); }
  if (pad.isEmpty()) return showErr('Dibuje su firma en el recuadro.');
  const firma = pad.data(); $('#sign').disabled = true; $('#sign').textContent = 'Guardando…';
  try {
    const r = await fetch('/api/firma/' + encodeURIComponent(token), { method: 'POST', headers: H, body: JSON.stringify({ documento: doc, firma, acepto: true, sha256: d.sha256 }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { $('#sign').disabled = false; $('#sign').textContent = 'Firmar el documento'; return showErr(j.detail || 'No se pudo guardar. Intente de nuevo.'); }
    card(head() + `<div class="res ok">Documento firmado el ${esc(fmt(j.firmado))}: quedó guardado en su ficha. Gracias.</div>
      <div class="doc">${rich(d.texto)}</div><div class="sigs">${therBlock()}<div class="sg"><img src="${firma}" alt="Su firma"><div class="ln"><b>${esc(d.firmante)}</b><br>${d.quien === 'Acudiente' ? 'Acudiente / representante legal' : 'Consultante'} · Doc. ${esc(d.documento)}<br><span class="muted">Firmado: ${esc(fmt(j.firmado))}</span></div></div></div><p class="muted" style="word-break:break-all">Huella SHA-256 del texto: ${esc(j.sha256)}</p>
      <button class="noprint" id="pr">Guardar o imprimir una copia</button><p class="muted noprint">También puede pedir una copia del documento firmado al consultorio.</p>`);
    $('#pr').onclick = () => print();
  } catch (e) { $('#sign').disabled = false; $('#sign').textContent = 'Firmar el documento'; showErr('No hay conexión. Intente de nuevo.'); }
}
function showErr(t) { let e = $('#err'); if (!e) { e = document.createElement('div'); e.id = 'err'; e.className = 'res bad'; $('#sign').before(e); } e.textContent = t; }
async function load() {
  const r = await fetch('/api/firma/' + encodeURIComponent(token), { headers: H });
  if (r.status === 404) return card('<div class="res bad">Este enlace no es válido. Ábralo de nuevo desde el mensaje que recibió.</div>');
  if (!r.ok) throw new Error();
  d = await r.json(); ask();
}
(async () => {
  if (!token) return card('<div class="res bad">El enlace está incompleto. Ábralo de nuevo desde el mensaje que recibió.</div>');
  try { await load(); } catch (e) { card('<div class="res bad">No se pudo cargar el documento. Intente en unos minutos.</div>'); }
})();
</script>
</body>
</html>
